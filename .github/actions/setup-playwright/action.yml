name: 'Setup Playwright with Browser Caching'
description: 'Install Playwright and cache browser binaries'
author: 'Political Sphere'

inputs:
  install-command:
    description: 'Command to install Playwright browsers'
    required: false
    default: 'npx playwright install --with-deps chromium'

outputs:
  cache-hit:
    description: 'Whether browser cache was hit'
    value: ${{ steps.cache-browsers.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
        echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
        echo "📦 Playwright version: $PLAYWRIGHT_VERSION"

    - name: Cache Playwright browsers
      id: cache-browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright browsers
      shell: bash
      env:
        INSTALL_CMD: ${{ inputs.install-command }}
        CACHE_HIT: ${{ steps.cache-browsers.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" == "true" ]; then
          echo "✅ Browser cache hit! Skipping installation."
        else
          echo "⚠️  Cache miss. Installing Playwright browsers..."
          eval "${INSTALL_CMD}"
          echo "✅ Playwright browsers installed successfully"
        fi

    - name: Verify Playwright installation
      shell: bash
      run: |
        echo "🔍 Verifying Playwright installation..."
        npx playwright --version
        echo "✅ Playwright ready"

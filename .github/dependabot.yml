version: 2
updates:
  # Enable version updates for npm (daily for security)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 15
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for GitHub Actions (weekly Monday)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'

  # Enable version updates for Docker images in apps/web
  - package-ecosystem: 'docker'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore(docker)'

  # Enable version updates for Docker images in apps/worker
  - package-ecosystem: 'docker'
    directory: '/apps/worker'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore(docker)'

  # Enable version updates for Docker images in apps/api
  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore(docker)'

  # Enable version updates for Terraform
  - package-ecosystem: 'terraform'
    directory: '/apps/infrastructure/terraform'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'terraform'
      - 'infrastructure'
    commit-message:
      prefix: 'chore(terraform)'

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /apps/api/openapi
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /apps/web/.vite/deps
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /docs/apps/.vitepress/cache/deps_temp_e07a905f
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /libs/ai-system
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /libs/game-engine
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /libs/shared
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /libs/testing
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /tools/config
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /tools/keycloak
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /tools/scripts/ai
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /vendor/js-yaml-patched
    schedule:
      interval: daily

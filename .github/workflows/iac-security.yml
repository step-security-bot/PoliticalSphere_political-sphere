name: 'Infrastructure Security Scanning'

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/infrastructure/**/*.tf'
      - 'apps/infrastructure/**/*.yml'
      - 'apps/infrastructure/**/*.yaml'
      - '**/Dockerfile'
      - '**/docker-compose*.yml'
      - '.github/workflows/iac-security.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/infrastructure/**/*.tf'
      - 'apps/infrastructure/**/*.yml'
      - 'apps/infrastructure/**/*.yaml'
      - '**/Dockerfile'
      - '**/docker-compose*.yml'
  schedule:
    # Weekly scan every Tuesday at 7 AM UTC
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov-scan:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@v12 # Latest stable version
        with:
          directory: .
          framework: terraform,dockerfile,kubernetes,secrets
          quiet: false
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          # Download external Terraform modules
          download_external_modules: true
          # Skip specific checks if needed (document in ADR)
          # skip_check: CKV_AWS_123,CKV_K8S_456
          # Fail on severity
          hard_fail_on: high,critical
          compact: true
          # Upload to Bridgecrew Cloud (requires PRISMA_API_URL secret)
          # api-key: ${{ secrets.PRISMA_API_KEY }}

      - name: Upload Checkov results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v3.27.5
        with:
          sarif_file: checkov-results.sarif
          category: 'checkov-iac-scan'

      - name: Upload Checkov results as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkov-security-results
          path: checkov-results.sarif
          retention-days: 90

      - name: Post PR comment with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.existsSync('checkov-results.sarif') 
              ? JSON.parse(fs.readFileSync('checkov-results.sarif', 'utf8'))
              : null;

            if (!results) {
              console.log('No Checkov results found');
              return;
            }

            const runs = results.runs || [];
            const totalFindings = runs.reduce((sum, run) => sum + (run.results || []).length, 0);

            const body = `## 🔒 Infrastructure Security Scan Results (Checkov)

            **Total Findings:** ${totalFindings}

            ${totalFindings > 0 ? '⚠️ Security issues detected in infrastructure code. Review the Security tab for details.' : '✅ No security issues detected in infrastructure code.'}

            **Scanned Frameworks:**
            - Terraform
            - Dockerfile
            - Kubernetes
            - Secrets

            [View detailed results in Security tab](https://github.com/${{ github.repository }}/security/code-scanning)`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  tfsec-scan:
    name: Terraform Security Scan (tfsec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3 # Latest stable version
        with:
          working_directory: apps/infrastructure/terraform
          soft_fail: false
          format: sarif
          additional_args: --minimum-severity HIGH

      - name: Upload tfsec results
        if: always()
        uses: github/codeql-action/upload-sarif@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v3.27.5
        with:
          sarif_file: results.sarif
          category: 'tfsec-terraform-scan'

  dockerfile-lint:
    name: Dockerfile Security Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0 # Latest stable version
        with:
          dockerfile: 'apps/*/Dockerfile'
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload Hadolint results
        if: always()
        uses: github/codeql-action/upload-sarif@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v3.27.5
        with:
          sarif_file: hadolint-results.sarif
          category: 'hadolint-dockerfile-scan'

  summary:
    name: IaC Security Summary
    runs-on: ubuntu-latest
    needs: [checkov-scan, tfsec-scan, dockerfile-lint]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🏗️ Infrastructure Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov (Multi-framework) | ${{ needs.checkov-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec (Terraform) | ${{ needs.tfsec-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hadolint (Dockerfile) | ${{ needs.dockerfile-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View all findings in Security tab](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY

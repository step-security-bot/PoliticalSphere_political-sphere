# ===============================================================================
# AI-ASSISTABLE METADATA
# ===============================================================================
# @workflow-name: Security Scanning
# @workflow-purpose: Consolidated security scanning (SAST, secrets, dependency, supply-chain)
# @workflow-category: security
# @workflow-criticality: high
# @workflow-owner: security-team
# @workflow-triggers: [push:main, pull_request:main, schedule]
# @workflow-dependencies: [gitleaks, semgrep, trivy, dependency-review]
# @workflow-stages: [secrets-and-workflows, sast-scanning, dependency-scanning, supply-chain]
# ===============================================================================
# ===============================================================================
# CONSOLIDATED SECURITY SCANNING WORKFLOW
# ===============================================================================
# This workflow consolidates all security scanning activities:
# - Vulnerability scanning (npm audit, Snyk, Trivy)
# - SAST scanning (Semgrep, CodeQL)
# - Secret scanning (Gitleaks)
# - Workflow security validation (actionlint, shell injection detection)
# - Supply chain security (SBOM generation, dependency review)
# - License compliance
# ==============================================================================

name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Mondays at 2 AM UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # Job 1: Secret Scanning & Workflow Security
  # ===========================================================================
  secrets-and-workflows:
    name: Secrets & Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks - Secret Scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Workflow Security
        run: |
          echo "🔍 Running workflow security validator..."
          bash scripts/validate-workflows.sh

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.4'
          # NOTE: Integrity checksum for actionlint release archive.
          # Not a credential; flagged by automated audit as potential secret.
          # security-false-positive: checksum value only.
          ACTIONLINT_SHA256: 'fc0a6886bbb9a23a39eeec4b176193cadb54ddbe77cdbb19b637933919545395'
        run: |
          echo "Installing actionlint ${ACTIONLINT_VERSION}..."
          curl -sSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm actionlint.tar.gz
          actionlint -version

      - name: Run actionlint
        run: |
          actionlint -color -verbose

      - name: Check for hardcoded secrets in workflows
        run: |
          echo "🔍 Scanning workflows for potential hardcoded secrets..."

          if find .github/workflows .github/actions libs/ci -type f \( -name "*.yml" -o -name "*.yaml" \) -exec \
            grep -iE '(password|secret|token|api[_-]?key|access[_-]?key|private[_-]?key)(\s*[:=]\s*["\x27][^\x27"]+["\x27])' {} + 2>/dev/null | \
            grep -v 'secrets\.' | grep -v 'inputs\.' | grep -v 'env\.' | grep -v '#'; then
            echo "❌ Potential hardcoded secrets found!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi

      - name: Validate Cryptographic Algorithms
        run: |
          echo "🔐 Running cryptographic algorithm validator..."
          bash scripts/validate-crypto.sh

  # ===========================================================================
  # Job 2: SAST - Static Application Security Testing
  # ===========================================================================
  sast-scanning:
    name: SAST Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: returntocorp/semgrep:1.67.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate required secrets
        shell: sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPO: ${{ github.repository }}
          SEMGREP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          # Only require secrets for pushes to main or PRs from same repo (not forks)
          if [ "${EVENT_NAME}" = "push" ] || [ "${PR_HEAD_REPO}" = "${CURRENT_REPO}" ]; then
            if [ -z "$SEMGREP_TOKEN" ]; then
              echo "::warning::SEMGREP_APP_TOKEN not set - scan will run in local mode only"
            fi
          else
            echo "::notice::Skipping Semgrep Cloud for fork PR (secrets not available)"
          fi

      - name: Run Semgrep Security Scan (OSS fallback)
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          echo "🔒 Running Semgrep security scan..."
          USE_CLOUD=false
          if [ -n "${SEMGREP_APP_TOKEN}" ] && { [ "${EVENT_NAME}" = "push" ] || [ "${PR_HEAD_REPO}" = "${CURRENT_REPO}" ]; }; then
            USE_CLOUD=true
          fi

          if [ "${USE_CLOUD}" = true ]; then
            echo "☁️ Semgrep Cloud mode (token detected)"
            semgrep ci --config auto --json --sarif --output semgrep-results.sarif > semgrep-results.json || true
          else
            echo "🧰 Semgrep OSS mode (no token or fork PR)"
            # Public, OSS-accessible rulesets only
            semgrep scan \
              --config p/default \
              --config p/owasp-top-ten \
              --json --sarif --output semgrep-results.sarif > semgrep-results.json || true
          fi

          if [ -f semgrep-results.json ]; then
            findings=$(jq '.results | length' semgrep-results.json 2>/dev/null || echo "0")
            echo "findings=${findings}" >> "$GITHUB_OUTPUT"
            echo "📈 Found ${findings} security findings"
            if [ "${findings}" -gt 0 ]; then
              echo "⚠️ Semgrep found security issues - review required"
            fi
          fi

      - name: Upload SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v4.31.4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        continue-on-error: true

      - name: Upload Semgrep Results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: semgrep-scan-results
          path: |
            semgrep-results.json
            semgrep-results.sarif
          retention-days: 30

  # ===========================================================================
  # Job 3: CodeQL Analysis (for JavaScript/TypeScript)
  # ===========================================================================
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Guard: limit changed files for PRs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100 },
              response => response.data.map(file => file.filename)
            );
            const limit = 300;
            if (files.length >= limit) {
              core.setFailed(`CodeQL diff mode unavailable: PR changes ${files.length} files (limit ${limit - 1}). Split into smaller PRs to enable diff-aware scanning.`);
            } else {
              core.info(`PR changes ${files.length} files; proceeding with diff-aware CodeQL.`);
            }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v4.31.4
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v4.31.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v4.31.4
        with:
          category: codeql

  # ===========================================================================
  # Job 4: Dependency & Vulnerability Scanning
  # ===========================================================================
  dependency-scanning:
    name: Dependency & Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional --legacy-peer-deps

      - name: Run npm audit
        run: |
          echo "🔍 Running npm audit..."
          npm audit --audit-level=moderate --json > npm-audit-results.json || true

          # Display summary
          if [ -f npm-audit-results.json ]; then
            echo "📊 Audit Summary:"
            jq '.metadata.vulnerabilities' npm-audit-results.json || true
          fi

      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0

      - name: Install Trivy
        env:
          TRIVY_VERSION: '0.67.2'
          # NOTE: Integrity checksum for Trivy release archive.
          # Not a credential; flagged by automated audit as potential secret.
          # security-false-positive: checksum value only.
          TRIVY_SHA256: '546511a5514afc813c0b72e4abeea2c16a32228a13a1e5114d927c190e76b1f9'
        run: |
          curl -sSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
          rm trivy.tar.gz

      - name: Run Trivy filesystem scan
        run: |
          echo "🔍 Running Trivy scan..."
          trivy fs --exit-code 0 --severity CRITICAL,HIGH --format json --output trivy-results.json .

          # Display summary
          if [ -f trivy-results.json ]; then
            echo "📊 Trivy found:"
            jq '.Results[] | select(.Vulnerabilities) | .Vulnerabilities | length' trivy-results.json || echo "0 vulnerabilities"
          fi

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 30

  # ===========================================================================
  # Job 5: Supply Chain Security & SBOM
  # ===========================================================================
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional --legacy-peer-deps

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          echo "📦 Generating SBOM..."
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json
          echo "✅ SBOM generated"

      - name: Build artifacts (if applicable)
        run: |
          if npm run build --if-present; then
            echo "✅ Build completed"
          else
            echo "ℹ️ No build script found or build skipped"
          fi

      - name: Attest build provenance (SLSA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/**
            libs/**/dist/**
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # ===========================================================================
  # Job 6: Security Summary & Reporting
  # ===========================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secrets-and-workflows, sast-scanning, dependency-scanning, supply-chain]
    if: always()
    steps:
      - name: Generate Security Summary
        run: |
          {
            echo "## 🔒 Security Scanning Summary"
            echo ""
            echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### Scans Performed"
            echo ""
            echo "- ✅ Secret scanning (Gitleaks)"
            echo "- ✅ Workflow security validation"
            echo "- ✅ SAST scanning (Semgrep)"
            echo "- ✅ CodeQL analysis"
            echo "- ✅ Dependency scanning (npm audit, Trivy)"
            echo "- ✅ Supply chain security (SBOM, SLSA provenance)"
            echo ""
            echo "### Security Guidelines"
            echo ""
            echo "- Never commit secrets or credentials"
            echo "- Keep dependencies updated regularly"
            echo "- Address critical/high vulnerabilities promptly"
            echo "- Use \`env:\` blocks for GitHub context in workflows"
            echo "- Pin action versions to commit SHAs"
            echo ""
            echo "📚 [Security Documentation](https://docs.github.com/en/code-security)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check job statuses
        run: |
          SECRETS_STATUS="${{ needs.secrets-and-workflows.result }}"
          SAST_STATUS="${{ needs.sast-scanning.result }}"
          DEPS_STATUS="${{ needs.dependency-scanning.result }}"
          SUPPLY_STATUS="${{ needs.supply-chain.result }}"

          echo "Job Results:"
          echo "  Secrets & Workflows: ${SECRETS_STATUS}"
          echo "  SAST Scanning: ${SAST_STATUS}"
          echo "  Dependency Scanning: ${DEPS_STATUS}"
          echo "  Supply Chain: ${SUPPLY_STATUS}"

          # Fail if any critical job failed
          if [[ "${SECRETS_STATUS}" == "failure" ]] || [[ "${SAST_STATUS}" == "failure" ]] || [[ "${DEPS_STATUS}" == "failure" ]]; then
            echo "❌ One or more security scans failed!"
            exit 1
          fi

          echo "✅ All security scans completed"

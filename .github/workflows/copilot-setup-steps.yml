name: 'Copilot Setup Steps'

# Automatically run the setup steps when changed for validation
# Allow manual testing through the repository's "Actions" tab
permissions: read-all
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Set minimal permissions - Copilot gets its own token for operations
    permissions:
      contents: read # Required to clone the repository

    steps:
      # Checkout repository with full history for git operations
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4.2.2
        with:
          # fetch-depth will be overridden by Copilot for security
          fetch-depth: 0
          lfs: false # Not using Git LFS currently

      # Setup Node.js with caching for faster dependency installation
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22' # Node 22 LTS (matches production)
          cache: 'npm'

      # Install project dependencies
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Build all projects in the monorepo
      - name: Build projects
        run: npm run build --if-present

      # Setup Python for data pipeline and AI tools
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install Python dependencies for AI tools and data processing
      - name: Install Python dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # Cache Nx computation results for faster builds
      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      # Pre-warm test environment
      - name: Pre-warm test environment
        run: |
          # Create necessary directories
          mkdir -p logs reports tmp data/runtime

          # Verify critical tools are available
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Python version: $(python --version)"

          # Pre-compile TypeScript for faster iteration
          npx tsc --version

      # Setup Docker for container-based testing (if needed)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          install: true

      # Validate environment is ready
      - name: Validate environment
        run: |
          echo "✅ Environment setup complete"
          echo "Repository: $(pwd)"
          echo "Node modules installed: $(du -sh node_modules 2>/dev/null || echo 'N/A')"
          echo "Nx cache ready: $([ -d .nx/cache ] && echo 'Yes' || echo 'No')"

          # Verify key commands are available
          command -v node >/dev/null 2>&1 && echo "✅ Node.js ready" || echo "❌ Node.js missing"
          command -v npm >/dev/null 2>&1 && echo "✅ npm ready" || echo "❌ npm missing"
          command -v python >/dev/null 2>&1 && echo "✅ Python ready" || echo "❌ Python missing"
          command -v docker >/dev/null 2>&1 && echo "✅ Docker ready" || echo "❌ Docker missing"

      # Display helpful debugging information
      - name: Environment summary
        if: always()
        run: |
          echo "=== Environment Summary ==="
          echo "OS: $(uname -a)"
          echo "Shell: $SHELL"
          echo "Working Directory: $(pwd)"
          echo "Available disk space: $(df -h . | tail -1 | awk '{print $4}')"
          echo "Available memory: $(free -h | grep Mem | awk '{print $7}')"
          echo ""
          echo "=== Installed Tools ==="
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Python: $(python --version)"
          echo "Git: $(git --version)"
          echo "Docker: $(docker --version 2>/dev/null || echo 'Not available')"

name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'libs/**'
      - '**/Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: game-server
            context: .
            dockerfile: apps/game-server/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned SHA)
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.7.1 (pinned SHA)
        with:
          platforms: ${{ matrix.service.platforms }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c # v3 (pinned SHA)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.6.1 (pinned SHA)
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "${{ matrix.service.dockerfile }}" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "✅ Dockerfile found: ${{ matrix.service.dockerfile }}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "⚠️ Dockerfile not found: ${{ matrix.service.dockerfile }}"
          fi

      - name: Build and push Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.service.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Generate SBOM
        if: steps.check_dockerfile.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom-${{ matrix.service.name }}.spdx.json

      - name: Upload SBOM artifact
        if: steps.check_dockerfile.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom-${{ matrix.service.name }}.spdx.json
          retention-days: 90

  security-scan:
    name: Security Scan Docker Images
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write

    strategy:
      matrix:
        service: [api, game-server, worker, web]

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ab2e54f42aa112ff08704159b88a57517f6f0ebb # v3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'docker-${{ matrix.service }}'

  docker-compose-test:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Check if docker-compose.yml exists
        id: check_compose
        run: |
          if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "✅ docker-compose file found"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "⚠️ docker-compose file not found"
          fi

      - name: Validate docker-compose configuration
        if: steps.check_compose.outputs.exists == 'true'
        run: |
          docker compose config --quiet
          echo "✅ docker-compose configuration is valid"

      - name: Start services with docker-compose
        if: steps.check_compose.outputs.exists == 'true'
        run: |
          docker compose up -d --wait
          docker compose ps
          echo "✅ All services started successfully"

      - name: Run health checks
        if: steps.check_compose.outputs.exists == 'true'
        run: |
          # Wait for services to be healthy
          timeout 60s bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done' || true
          docker compose ps

      - name: Show logs on failure
        if: failure() && steps.check_compose.outputs.exists == 'true'
        run: docker compose logs

      - name: Clean up
        if: always() && steps.check_compose.outputs.exists == 'true'
        run: docker compose down -v

  notify:
    name: Notify on Completion
    needs: [build-and-push, security-scan, docker-compose-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Check job status
        id: status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ] && \
             [ "${{ needs.security-scan.result }}" == "success" ] && \
             [ "${{ needs.docker-compose-test.result }}" == "success" ]; then
            echo "status=success" >> "${GITHUB_OUTPUT}"
            echo "message=✅ All Docker builds completed successfully" >> "${GITHUB_OUTPUT}"
          else
            echo "status=failure" >> "${GITHUB_OUTPUT}"
            echo "message=❌ Some Docker builds failed" >> "${GITHUB_OUTPUT}"
          fi

      - name: Summary
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "- Build and Push: ${{ needs.build-and-push.result }}"
            echo "- Security Scan: ${{ needs.security-scan.result }}"
            echo "- Docker Compose Test: ${{ needs.docker-compose-test.result }}"
            echo ""
            echo "${{ steps.status.outputs.message }}"
          } >> "${GITHUB_STEP_SUMMARY}"

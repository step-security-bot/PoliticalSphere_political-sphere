name: OSSF Scorecard

# Security posture scanning using OpenSSF Scorecard
# Reference: https://github.com/ossf/scorecard-action
# CHANGELOG: Add entry documenting introduction of automated Scorecard scans (token hardening verification)

on:
  schedule:
    - cron: '30 2 * * 1' # Weekly Monday 02:30 UTC
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scorecard:
    name: Run OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4.2.2 (pinned SHA)
        with:
          fetch-depth: 0

      - name: Run Scorecard
        # Pin by commit SHA for supply-chain security (v2.4.3)
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3 (pinned SHA)
        with:
          results_file: results.json
          results_format: json
          publish_results: true
          # scorecard automatically uses GITHUB_TOKEN

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v3 (pinned SHA)
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Summarize important checks
        run: |
          if [ -f results.json ]; then
            TOKENS=$(jq -r '.checks[] | select(.name=="Token-Permissions") | .score' results.json || echo "")
            echo "Token-Permissions score: ${TOKENS}" >> "$GITHUB_STEP_SUMMARY"
            echo "See full JSON artifact for detailed scores." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30
      - name: Run Scorecard (SARIF)
        # Second invocation to produce SARIF for code scanning ingestion
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

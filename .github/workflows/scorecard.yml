name: OSSF Scorecard

# Security posture scanning using OpenSSF Scorecard
# Reference: https://github.com/ossf/scorecard-action
# CHANGELOG: Add entry documenting introduction of automated Scorecard scans (token hardening verification)

on:
  schedule:
    - cron: '30 2 * * 1' # Weekly Monday 02:30 UTC
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scorecard:
    name: Run OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned SHA)
        with:
          fetch-depth: 0

      - name: Run Scorecard
        # Pin by commit SHA for supply-chain security (v2.4.3)
        uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2 # v2.4.3 (pinned SHA)
        with:
          results_file: results.json
          results_format: json
          publish_results: true
          # scorecard automatically uses GITHUB_TOKEN

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c1a2b73420f0c02efb863cc6921c531bc1a54f4f # v3 (pinned SHA)
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Summarize important checks
        run: |
          if [ -f results.json ]; then
            TOKENS=$(jq -r '.checks[] | select(.name=="Token-Permissions") | .score' results.json || echo "")
            echo "Token-Permissions score: ${TOKENS}" >> "$GITHUB_STEP_SUMMARY"
            echo "See full JSON artifact for detailed scores." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30
      - name: Run Scorecard (SARIF)
        # Second invocation to produce SARIF for code scanning ingestion
        uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@ab2e54f42aa112ff08704159b88a57517f6f0ebb # v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: political-sphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-political}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-political_dev}
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=en_US.UTF-8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-political} -d ${POSTGRES_DB:-political_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - political-sphere

  redis:
    image: redis:7-alpine
    container_name: political-sphere-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - political-sphere

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: political-sphere-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-political}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-political_dev}?schema=public'
      REDIS_URL: 'redis://default:${REDIS_PASSWORD:-changeme}@redis:6379/0'
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./apps/api:/app/apps/api:cached
      - ./libs:/app/libs:cached
      - api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - political-sphere

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: political-sphere-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      VITE_API_URL: http://localhost:4000
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    volumes:
      - ./apps/web:/app/apps/web:cached
      - ./libs:/app/libs:cached
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - political-sphere

networks:
  political-sphere:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  api-node-modules:
  web-node-modules:
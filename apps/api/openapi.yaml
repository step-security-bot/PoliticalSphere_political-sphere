openapi: 3.1.0
info:
  title: Political Sphere API
  description: REST API for Political Sphere democratic simulation platform
  version: 1.0.0
  contact:
    name: Political Sphere Team
    url: https://github.com/PoliticalSphere/political-sphere
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api-staging.political-sphere.com
    description: Staging environment
  - url: https://api.political-sphere.com
    description: Production environment

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/register

  schemas:
    User:
      type: object
      required: [id, username, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    CreateUserInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    UpdateUserInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email

    UserDataExport:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        exportDate:
          type: string
          format: date-time
        dataRetention:
          type: string
          description: Information about data retention policies

    Bill:
      type: object
      required: [id, title, proposerId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        proposerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateBillInput:
      type: object
      required: [title, proposerId]
      properties:
        title:
          type: string
        description:
          type: string
        proposerId:
          type: string
          format: uuid

    UpdateBillInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    Party:
      type: object
      required: [id, name, color, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        createdAt:
          type: string
          format: date-time

    CreatePartyInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'

    Vote:
      type: object
      required: [billId, userId, vote]
      properties:
        billId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vote:
          type: string
          enum: [for, against, abstain]

    VoteCounts:
      type: object
      properties:
        for:
          type: integer
          minimum: 0
        against:
          type: integer
          minimum: 0
        abstain:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The refresh token obtained from login or register

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: auth
    Election:
      type: object
      required: [id, name, startDate, endDate, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, active, completed, cancelled]
        createdAt:
          type: string
          format: date-time

    CreateElectionInput:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    Campaign:
      type: object
      required: [id, electionId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        electionId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCampaignInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    Constituency:
      type: object
      required: [id, electionId, name, region, seats]
      properties:
        id:
          type: string
          format: uuid
        electionId:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
        seats:
          type: integer
          minimum: 1

    CreateConstituencyInput:
      type: object
      required: [name, region, seats]
      properties:
        name:
          type: string
        region:
          type: string
        seats:
          type: integer
          minimum: 1

    Candidate:
      type: object
      required: [id, electionId, name, partyId]
      properties:
        id:
          type: string
          format: uuid
        electionId:
          type: string
          format: uuid
        name:
          type: string
        partyId:
          type: string
          format: uuid
        constituencyId:
          type: string
          format: uuid

    CreateCandidateInput:
      type: object
      required: [name, partyId]
      properties:
        name:
          type: string
        partyId:
          type: string
          format: uuid
        constituencyId:
          type: string
          format: uuid

    ElectionVote:
      type: object
      required: [electionId, userId, candidateId]
      properties:
        electionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        constituencyId:
          type: string
          format: uuid

    ElectionResults:
      type: object
      properties:
        electionId:
          type: string
          format: uuid
        totalVotes:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              candidateId:
                type: string
                format: uuid
              candidateName:
                type: string
              partyId:
                type: string
                format: uuid
              votes:
                type: integer
              percentage:
                type: number
                format: float

    CertifyElectionInput:
      type: object
      required: [certified]
      properties:
        certified:
          type: boolean
        notes:
          type: string

    Government:
      type: object
      required: [id, name, formedDate, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        formedDate:
          type: string
          format: date-time
        dissolvedDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, dissolved]
        createdAt:
          type: string
          format: date-time

    CreateGovernmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Minister:
      type: object
      required: [id, governmentId, userId, position, appointedDate]
      properties:
        id:
          type: string
          format: uuid
        governmentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        position:
          type: string
        appointedDate:
          type: string
          format: date-time
        removedDate:
          type: string
          format: date-time
          nullable: true

    CreateMinisterInput:
      type: object
      required: [userId, position]
      properties:
        userId:
          type: string
          format: uuid
        position:
          type: string

    GovernmentAction:
      type: object
      required: [id, governmentId, type, description, date]
      properties:
        id:
          type: string
          format: uuid
        governmentId:
          type: string
          format: uuid
        type:
          type: string
          enum: [policy, appointment, dismissal, other]
        description:
          type: string
        date:
          type: string
          format: date-time

    CreateGovernmentActionInput:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [policy, appointment, dismissal, other]
        description:
          type: string

    CabinetMeeting:
      type: object
      required: [id, governmentId, date, agenda]
      properties:
        id:
          type: string
          format: uuid
        governmentId:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        agenda:
          type: string
        minutes:
          type: string
        attendees:
          type: array
          items:
            type: string
            format: uuid

    CreateCabinetMeetingInput:
      type: object
      required: [date, agenda]
      properties:
        date:
          type: string
          format: date-time
        agenda:
          type: string
        attendees:
          type: array
          items:
            type: string
            format: uuid

    ModerationContent:
      type: object
      required: [id, content, contentType, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        contentType:
          type: string
          enum: [post, comment, profile, message]
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, approved, rejected]

    ReportRequest:
      type: object
      required: [contentId, reason]
      properties:
        contentId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [spam, harassment, hate_speech, misinformation, inappropriate]
        details:
          type: string

    AnalyzeRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        contentType:
          type: string
          enum: [post, comment, profile, message]

    AnalyzeResponse:
      type: object
      properties:
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        categories:
          type: array
          items:
            type: string
        flagged:
          type: boolean

    ModerationQueueItem:
      type: object
      properties:
        contentId:
          type: string
          format: uuid
        content:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        reportedCount:
          type: integer
          minimum: 0

    ReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string

    TransparencyResponse:
      type: object
      properties:
        totalModerated:
          type: integer
          minimum: 0
        approved:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        averageResponseTime:
          type: number
          format: float

    StatsResponse:
      type: object
      properties:
        totalReports:
          type: integer
          minimum: 0
        pendingReviews:
          type: integer
          minimum: 0
        resolvedToday:
          type: integer
          minimum: 0

    ClearCacheResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    Chamber:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [house_of_commons, house_of_lords, other]
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateChamberInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [house_of_commons, house_of_lords, other]
        description:
          type: string

    Motion:
      type: object
      required: [id, title, proposerId, chamberId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        proposerId:
          type: string
          format: uuid
        chamberId:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, proposed, debating, voting, passed, rejected, withdrawn]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMotionInput:
      type: object
      required: [title, proposerId, chamberId]
      properties:
        title:
          type: string
        description:
          type: string
        proposerId:
          type: string
          format: uuid
        chamberId:
          type: string
          format: uuid

    Debate:
      type: object
      required: [id, motionId, chamberId, startTime]
      properties:
        id:
          type: string
          format: uuid
        motionId:
          type: string
          format: uuid
        chamberId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        transcript:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]

    CreateDebateInput:
      type: object
      required: [motionId, chamberId, startTime]
      properties:
        motionId:
          type: string
          format: uuid
        chamberId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        transcript:
          type: string

    ParliamentaryVote:
      type: object
      required: [id, motionId, userId, vote]
      properties:
        id:
          type: string
          format: uuid
        motionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vote:
          type: string
          enum: [for, against, abstain]
        timestamp:
          type: string
          format: date-time

    CreateParliamentaryVoteInput:
      type: object
      required: [motionId, vote]
      properties:
        motionId:
          type: string
          format: uuid
        vote:
          type: string
          enum: [for, against, abstain]

    VoteResults:
      type: object
      properties:
        motionId:
          type: string
          format: uuid
        for:
          type: integer
          minimum: 0
        against:
          type: integer
          minimum: 0
        abstain:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [open, closed]

    ComplianceAlert:
      type: object
      required: [id, type, severity, message, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [data_breach, policy_violation, security_incident, compliance_issue]
        severity:
          type: string
          enum: [low, medium, high, critical]
        message:
          type: string
        details:
          type: object
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          format: uuid
          nullable: true

    ComplianceEvent:
      type: object
      required: [id, type, userId, details, timestamp]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        userId:
          type: string
          format: uuid
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    BreachNotification:
      type: object
      required: [type, description, affectedUsers, timestamp]
      properties:
        type:
          type: string
        description:
          type: string
        affectedUsers:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        details:
          type: object

    AuditLogEntry:
      type: object
      required: [id, action, userId, resource, timestamp]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        userId:
          type: string
          format: uuid
        resource:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    ComplianceMetrics:
      type: object
      properties:
        totalAlerts:
          type: integer
          minimum: 0
        activeAlerts:
          type: integer
          minimum: 0
        resolvedAlerts:
          type: integer
          minimum: 0
        subjectRightsRequests:
          type: integer
          minimum: 0
        processedRequests:
          type: integer
          minimum: 0
        averageProcessingTime:
          type: number
          format: float
        auditLogEntries:
          type: integer
          minimum: 0

    SubjectRightsRequest:
      type: object
      required: [id, userId, type, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [access, deletion, rectification, portability]
        status:
          type: string
          enum: [pending, processing, completed, rejected]
        details:
          type: string
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
        processedBy:
          type: string
          format: uuid
          nullable: true
        data:
          type: object
          nullable: true

    SubjectRightsData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        data:
          type: object
        exportDate:
          type: string
          format: date-time

    ComplianceDashboard:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceAlert'
        metrics:
          $ref: '#/components/schemas/ComplianceMetrics'
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceEvent'
        pendingRequests:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRightsRequest'

        paths:
/auth/register:
  post:
    summary: Register a new user
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserInput'
    responses:
      '201':
        description: User registered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
                accessToken:
                  type: string
                refreshToken:
                  type: string
      '400':
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/auth/login:
  post:
    summary: Login user
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username:
                type: string
              password:
                type: string
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/auth/refresh:
  post:
    summary: Refresh access token
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshTokenRequest'
    responses:
      '200':
        description: Token refreshed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
      '400':
        description: Invalid refresh token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Refresh token expired or invalid
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/auth/logout:
  post:
    summary: Logout user and revoke refresh token
    tags: [Authentication]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Logged out successfully
      '400':
        description: No refresh token found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/auth/me:
  get:
    summary: Get current authenticated user information
    tags: [Authentication]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User information retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/auth/health:
  get:
    summary: Health check for authentication service
    tags: [Authentication]
    security: []
    responses:
      '200':
        description: Service is healthy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthResponse'

/api/users:
  post:
    summary: Create a new user
    tags: [Users]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserInput'
    responses:
      '201':
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '400':
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  get:
    summary: Get all users
    tags: [Users]
    responses:
      '200':
        description: List of users
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/User'

/api/users/{id}:
  get:
    summary: Get user by ID
    tags: [Users]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      '200':
        description: User details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  put:
    summary: Update user
    tags: [Users]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: User ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserInput'
    responses:
      '200':
        description: User updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '400':
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: User not found

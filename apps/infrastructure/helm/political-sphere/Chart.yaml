apiVersion: v2
name: political-sphere
description: A Helm chart for deploying the Political Sphere application
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - political
  - simulation
  - multiplayer
  - game

home: https://political-sphere.com
sources:
  - https://github.com/political-sphere/platform

maintainers:
  - name: Political Sphere Team
    email: admin@political-sphere.com

dependencies:
  - name: ingress-nginx
    version: "4.10.0"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress-nginx.enabled
  - name: cert-manager
    version: "v1.14.0"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled
  - name: prometheus
    version: "25.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "7.3.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
  - name: elasticsearch
    version: "8.5.1"
    repository: "https://helm.elastic.co"
    condition: elasticsearch.enabled
  - name: kibana
    version: "8.5.1"
    repository: "https://helm.elastic.co"
    condition: kibana.enabled
min_version: 1.4.7

# Lean, fast hooks for solo-dev workflow
# Ref: https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json,md,css,scss,html,yml,yaml}'
      run: npx prettier --write --log-level warn {staged_files}
      stage_fixed: true

    lint:
      glob: '*.{ts,tsx,js,jsx}'
      run: npx eslint --max-warnings 0 --cache --cache-location .lefthook-cache/eslint {staged_files}
      stage_fixed: true

    typecheck-lite:
      glob: '*.{ts,tsx}'
      run: npx tsc --noEmit --pretty false --incremental

    quality-check:
      run: node tools/scripts/dev-workflow.js --pre-commit
      stage_fixed: false

    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact
        else
          echo "gitleaks not installed (brew install gitleaks)"
        fi

    ai-neutrality-check:
      run: echo "AI neutrality check placeholder (enable full run via ENABLE_AI_HOOKS=1)"
    ai-semantic-quality:
      run: echo "AI semantic quality placeholder"
    ai-competence-quick:
      run: echo "AI competence quick placeholder"
    update-ai-index:
      run: echo "AI index update placeholder"

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run type-check
    tests:
      run: npm run test:fast

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
